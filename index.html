<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOODWE PAKISTAN · Accounts</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fff'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='800' font-size='20' text-anchor='middle' fill='%23E2231A'%3EW%3C/text%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #0A0A0A; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: 24px;
      font-family: Arial, sans-serif; color: #F2F2F2; text-align: center; }
    #fallback a { color: #E2231A; }
  </style>
</head>
<body>
  <!--
    Accounts portal on https://accounts.goodwectms.cloud
    The portal itself runs on Google Apps Script. This page shows it full-screen so the address bar keeps the
    company domain. Keep using "Manage deployments → New version" when updating, so the URL below never changes.
  -->
  <iframe id="app"
          src="https://script.google.com/macros/s/AKfycbw9dSaMzG6F4t0dX9P8Om1H6dejG3COEZsuz4GBfPeF11vxgWxV4_AexXbCGg91H1df/exec"
          title="GOODWE PAKISTAN Accounts"
          allow="clipboard-read; clipboard-write; fullscreen"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div id="fallback">
    <p>The Accounts portal didn’t load here.<br>
      <a href="https://script.google.com/macros/s/AKfycbw9dSaMzG6F4t0dX9P8Om1H6dejG3COEZsuz4GBfPeF11vxgWxV4_AexXbCGg91H1df/exec">Open it directly</a></p>
  </div>

  <script>
    // If the portal can't be shown inside this page (e.g. an old deployment without ALLOWALL),
    // offer a direct link after a short wait.
    var shown = false;
    document.getElementById('app').addEventListener('load', function () { shown = true; });
    setTimeout(function () { if (!shown) document.getElementById('fallback').style.display = 'flex'; }, 15000);
  </script>
</body>
</html>
